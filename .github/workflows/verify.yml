name: Build four clients

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: flutter analyze
      - name: Test with isolated SSH fixture
        shell: bash
        run: |
          python -m pip install -r tool/requirements-qa.txt
          python tool/ssh_fixture.py > "$RUNNER_TEMP/ssh-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import socket, time
          for attempt in range(100):
              try:
                  with socket.create_connection(('127.0.0.1', 22345), timeout=.5):
                      break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit('SSH fixture did not start')
          PY
          flutter test --dart-define=SSH_INTEGRATION=true
          python tool/verify_synthetic_backup.py

  windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package complete application
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath FastCat-SSH-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FastCat-SSH-Windows-x64
          path: FastCat-SSH-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS release (ad hoc signed)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/fastcat_ssh.app FastCat-SSH-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FastCat-SSH-macOS
          path: FastCat-SSH-macOS.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android release (test key)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FastCat-SSH-Android-test-key
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned and simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned device application
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ci/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ci/ios/Payload/
          cd build/ci/ios
          zip -qry FastCat-SSH-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FastCat-SSH-iOS-unsigned
          path: build/ci/ios/FastCat-SSH-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Build simulator application
        run: flutter build ios --simulator --debug
      - name: Package simulator application
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app FastCat-SSH-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FastCat-SSH-iOS-simulator
          path: FastCat-SSH-iOS-simulator.zip
          if-no-files-found: error
          retention-days: 14
